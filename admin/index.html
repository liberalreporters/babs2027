
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>BABS 2027 | Content Manager</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background: #f5f7fb;
      color: #172033;
      font-family: system-ui, sans-serif;
    }
    main {
      width: min(100%, 560px);
      box-sizing: border-box;
      padding: 30px;
      background: white;
      border: 1px solid #e1e6ef;
      border-radius: 14px;
    }
    h1 { color: #0b1f3a; }
    p { line-height: 1.6; }
    a { color: #1457a6; }
  </style>
</head>
<body>
  <main>
    <h1>BABS 2027 Content Manager</h1>
    <p id="status" role="status" aria-live="polite">
      Loading the content manager...
    </p>
    <p>
      GitHub sign-in requires a correctly configured
      authentication service.
    </p>
    <p><a href="/">Return to the public website</a></p>
  </main>

  <script>
    window.addEventListener("error", function (event) {
      if (event.target && event.target.tagName === "SCRIPT") {
        document.getElementById("status").textContent =
          "The content manager could not load. Check your internet connection and reload.";
      }
    }, true);
  </script>

  <script
    src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"
    onload="document.getElementById('status').textContent='Content manager library loaded. Initialising...'"
    onerror="document.getElementById('status').textContent='Unable to load the content manager library.'">
  </script>
</body>
</html>
